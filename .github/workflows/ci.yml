name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check code formatting (StyLua)
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check .
          version: latest

      - name: Lua code analysis (Luacheck)
        uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1.2.0
        with:
          args: lua tests --config .luacheckrc

  test:
    name: Unit & Integration Tests (${{ matrix.os }} - ${{ matrix.neovim-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim-version: [v0.10.0, stable, nightly]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      - name: Install dependencies (plenary.nvim)
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim .ci/plenary.nvim

      - name: Install moo-lsp-rs binary
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          OS="$(uname -s)"
          ARCH="$(uname -m)"
          if [ "$OS" = "Linux" ]; then
            TARGET="linux-x64"
          elif [ "$OS" = "Darwin" ]; then
            if [ "$ARCH" = "arm64" ]; then
              TARGET="darwin-arm64"
            else
              TARGET="darwin-x64"
            fi
          fi
          curl -sL "https://github.com/kruton/moo-lsp-rs/releases/download/v0.2.14/moo-lsp-rs-${TARGET}.tar.gz" | tar -xz --strip-components=1 -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/moo-lsp-rs"

      - name: Run plenary test harness
        run: |
          nvim --headless -u tests/minimal_init.lua -c "PlenaryBustedDirectory tests {minimal_init = 'tests/minimal_init.lua', sequential = true}"
